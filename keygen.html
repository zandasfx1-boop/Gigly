<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><link rel="icon" href="logo.svg"><title>Gigly notification keys</title>
<style>:root{--bg:#eef1ff;--tx:#0d1030;--card:rgba(255,255,255,.8);--bd:rgba(91,108,255,.22);--ac:#5b6cff;--ac2:#18c4ff}
@media(prefers-color-scheme:dark){:root{--bg:#07081a;--tx:#eef0ff;--card:rgba(22,26,64,.85);--bd:rgba(170,185,255,.18)}}
body{font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif;max-width:560px;margin:0 auto;padding:22px 18px 50px;line-height:1.5;background:radial-gradient(700px 400px at 10% -5%,rgba(91,108,255,.28),transparent 60%),var(--bg);color:var(--tx);min-height:100vh}
.b{display:flex;align-items:center;gap:10px;font-weight:900;font-size:22px;letter-spacing:-.03em}.b img{width:34px;height:34px;border-radius:10px}
h1{font-size:26px;letter-spacing:-.03em;margin:18px 0 4px}
button{width:100%;height:50px;border:0;border-radius:16px;background:linear-gradient(120deg,var(--ac),var(--ac2));color:#fff;font-weight:800;font-size:16px;margin:8px 0;box-shadow:0 12px 24px -10px rgba(91,108,255,.8),inset 0 1px 0 rgba(255,255,255,.5);transition:transform .25s}
button:active{transform:scale(.96)}button[id^=cp]{background:var(--card);color:var(--tx);border:1px solid var(--bd);box-shadow:none}
textarea{width:100%;height:84px;border-radius:14px;border:1px solid var(--bd);padding:10px;font-size:14px;word-break:break-all;background:var(--card);color:var(--tx);box-sizing:border-box}
label{font-weight:800;display:block;margin-top:16px}.w{color:#ff4d6d;font-size:14px;font-weight:600}</style></head><body>
<div class="b"><img src="logo.svg" alt="">Gigly</div><h1>Notification keys</h1>
<p>This page makes your keys on your own phone. Nothing is sent anywhere.</p>
<button id="g">Generate keys</button>
<label>Public key (name: VAPID_PUBLIC_KEY)</label><textarea id="pub" readonly></textarea><button id="cp1">Copy public key</button>
<label>Private key (name: VAPID_PRIVATE_KEY)</label><textarea id="prv" readonly></textarea><button id="cp2">Copy private key</button>
<p class="w">Keep the private key secret. Never send it to anyone, not even Claude. Paste it only into Supabase secrets.</p>
<script>
const b64u=a=>btoa(String.fromCharCode(...a)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
document.getElementById("g").onclick=async()=>{
  const kp=await crypto.subtle.generateKey({name:"ECDSA",namedCurve:"P-256"},true,["sign","verify"]);
  document.getElementById("pub").value=b64u(new Uint8Array(await crypto.subtle.exportKey("raw",kp.publicKey)));
  document.getElementById("prv").value=(await crypto.subtle.exportKey("jwk",kp.privateKey)).d;
};
const cp=(id)=>async()=>{const t=document.getElementById(id);if(!t.value)return;try{await navigator.clipboard.writeText(t.value);}catch(e){t.select();document.execCommand("copy");}};
document.getElementById("cp1").onclick=cp("pub");document.getElementById("cp2").onclick=cp("prv");
</script></body></html>
