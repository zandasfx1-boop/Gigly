<style>
:root{
  --bg:#f2f2f7;--card:rgba(255,255,255,.72);--solid:#fff;--text:#0b0b0f;--muted:#6e6e73;--line:rgba(60,60,67,.16);
  --acc:#34c759;--acc-t:#fff;--blue:#0a84ff;--bad:#ff3b30;--warn:#ff9500;--fill:rgba(118,118,128,.12);
  --glass-b:rgba(255,255,255,.55);--shadow:0 8px 30px rgba(0,0,0,.08);
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#000;--card:rgba(44,44,46,.62);--solid:#1c1c1e;--text:#fff;--muted:#98989f;--line:rgba(84,84,88,.5);
  --acc:#30d158;--acc-t:#04140a;--fill:rgba(118,118,128,.28);--glass-b:rgba(255,255,255,.1);--shadow:0 8px 30px rgba(0,0,0,.5)}}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Inter',system-ui,sans-serif;line-height:1.4;-webkit-font-smoothing:antialiased;overflow-x:hidden;letter-spacing:-.01em}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
.blobs{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.35;animation:fl 20s ease-in-out infinite}
.b1{width:380px;height:380px;background:#34c759;top:-120px;left:-100px}.b2{width:340px;height:340px;background:#0a84ff;top:40%;right:-140px;animation-delay:-7s;opacity:.22}.b3{width:300px;height:300px;background:#64d2ff;bottom:-120px;left:10%;opacity:.2;animation-delay:-12s}
@keyframes fl{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-40px) scale(1.12)}}
.glass{background:var(--card);backdrop-filter:blur(30px) saturate(190%);-webkit-backdrop-filter:blur(30px) saturate(190%);border:1px solid var(--glass-b);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.35);border-radius:24px}

/* top bar */
#top{position:fixed;top:0;left:0;right:0;z-index:40;padding:calc(var(--safe-t) + 10px) 16px 10px;display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(var(--bg),transparent);}
#top .bar-in{max-width:1000px;margin:0 auto;width:100%;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;letter-spacing:-.02em}
.brand img{width:30px;height:30px;border-radius:9px;box-shadow:0 4px 12px rgba(52,199,89,.4)}
.brand i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#5ef08a,#1fa34a);display:grid;place-items:center;color:#fff;font-style:normal;font-size:16px;box-shadow:0 4px 12px rgba(52,199,89,.4)}
.chip{font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px;background:var(--fill)}
main{max-width:1000px;margin:0 auto;padding:calc(var(--safe-t) + 70px) 16px calc(110px + var(--safe-b))}
.large{font-size:clamp(32px,8vw,40px);font-weight:800;letter-spacing:-.035em;line-height:1.05;margin:6px 0 4px}
.sub{color:var(--muted);font-size:15px;margin-bottom:16px}

/* search + chips */
.search{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:14px;padding:0 12px;height:42px}
.search svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round}
.search input{flex:1;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 16px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;padding:8px 15px;border-radius:999px;background:var(--fill);font-size:14px;font-weight:600;transition:.2s}
.chips button.on{background:var(--text);color:var(--bg)}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{padding:18px;display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:transform .25s}
.card:active{transform:scale(.98)}
.cat{font-size:12px;font-weight:700;color:var(--acc);text-transform:uppercase;letter-spacing:.06em}
.card h3{font-size:19px;font-weight:700;letter-spacing:-.025em;line-height:1.2}
.card p{font-size:14px;color:var(--muted);flex:1}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:6px;padding-top:12px;border-top:.5px solid var(--line);font-size:14px}
.price{font-weight:800;font-size:16px}
.by{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.plink{cursor:pointer}
.locsel{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--fill);color:inherit;font-size:15px;margin:0 0 12px}
.loc{font-size:12px;color:var(--muted);margin-left:6px}.taken-b{font-size:11px;font-weight:700;background:var(--bad);color:#fff;border-radius:99px;padding:2px 8px;margin-left:6px}.card.taken{opacity:.6}
.ib-n{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--acc);color:var(--acc-t);font-size:12px;font-weight:700;display:grid;place-items:center;flex:none}
.perks{list-style:none;margin:0 0 16px;padding:0}.perks li{padding:7px 0;font-size:15px;display:flex;gap:10px}.perks li:before{content:"✓";color:var(--acc);font-weight:800}
.rx{display:flex;gap:12px;font-size:13px;color:var(--muted);margin-top:8px}.rx:empty{display:none}
.rx-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.rx-bar small{color:var(--muted);font-size:12px}
.rx-b{padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--fill);font-size:15px}.rx-b.on{border-color:var(--acc)}
.sw-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0 16px}.sw-b{width:34px;height:34px;border-radius:50%;border:2px solid var(--line)}.sw-row input{width:44px;height:38px;border:0;background:none;padding:0}
.ed-btn{background:none;border:0;color:inherit;opacity:.6;font-size:13px;margin-left:8px;padding:0}.ch-top .plink{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.av-s{overflow:hidden;flex:none;width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,#8e8e93,#636366);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700}
.tick{display:inline-block;width:18px;height:18px;font-size:0;color:transparent;overflow:hidden;vertical-align:-4px;background:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Cpolygon points=%2212.00%2C1.10 14.43%2C2.92 17.45%2C2.56 18.65%2C5.35 21.44%2C6.55 21.08%2C9.57 22.90%2C12.00 21.08%2C14.43 21.44%2C17.45 18.65%2C18.65 17.45%2C21.44 14.43%2C21.08 12.00%2C22.90 9.57%2C21.08 6.55%2C21.44 5.35%2C18.65 2.56%2C17.45 2.92%2C14.43 1.10%2C12.00 2.92%2C9.57 2.56%2C6.55 5.35%2C5.35 6.55%2C2.56 9.57%2C2.92%22 fill=%22%231877F2%22 stroke=%22%231877F2%22 stroke-width=%221.9%22 stroke-linejoin=%22round%22/%3E%3Cpath d=%22M7.4 12.3l3 3.1 6.2-6.9%22 fill=%22none%22 stroke=%22%23fff%22 stroke-width=%222.3%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E") center/contain no-repeat}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px}
.pill.pending{background:rgba(255,149,0,.16);color:var(--warn)}.pill.approved{background:rgba(52,199,89,.16);color:var(--acc)}.pill.rejected,.pill.closed{background:rgba(255,59,48,.14);color:var(--bad)}
.empty{text-align:center;color:var(--muted);padding:50px 10px;font-size:15px}
.banner{padding:12px 16px;border-radius:16px;font-size:14px;margin-bottom:16px;background:rgba(52,199,89,.14);color:var(--text)}
.banner.warn{background:rgba(255,149,0,.15)}
.banner.info{background:rgba(10,132,255,.13)}

/* grouped form (iOS settings) */
.group{background:var(--solid);border-radius:18px;overflow:hidden;margin-bottom:18px;box-shadow:var(--shadow)}
.group .r{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:50px;border-bottom:.5px solid var(--line)}
.group .r:last-child{border-bottom:0}
.group .r label{width:104px;flex:none;font-size:16px}
.group .r input,.group .r select{flex:1;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:16px;text-align:right;min-width:0;padding:14px 0;appearance:none;-webkit-appearance:none}
.group .r select{cursor:pointer}
.group .col{padding:12px 16px;border-bottom:.5px solid var(--line)}
.group .col label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.group textarea{width:100%;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:16px;min-height:110px;resize:vertical}
.group-title{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:0 16px 8px}
.btn{display:flex;width:100%;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:16px;font-size:17px;font-weight:700;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.5}
.btn-p{background:var(--acc);color:var(--acc-t);box-shadow:0 8px 20px rgba(52,199,89,.3)}
.btn-s{background:var(--fill)}
.btn-d{background:var(--solid);color:var(--bad)}
.btn-sm{height:36px;width:auto;padding:0 16px;font-size:14px;border-radius:999px}

/* list rows */
.list{display:flex;flex-direction:column;gap:10px}
.item{padding:14px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-radius:20px}
.item .grow{flex:1;min-width:180px}.item b{font-size:16px}.item .m{font-size:13px;color:var(--muted)}
.actions{display:flex;gap:8px}

/* profile */
.phead{text-align:center;padding:10px 0 20px}
.av-wrap{position:relative;width:96px;height:96px;margin:0 auto 12px;cursor:pointer}.av-wrap .avatar{margin:0}
.cam{position:absolute;right:-4px;bottom:-2px;width:32px;height:32px;border-radius:50%;background:var(--acc);display:grid;place-items:center;font-size:15px;border:3px solid var(--bg)}
.avatar{width:96px;height:96px;border-radius:50%;object-fit:cover;margin:0 auto 12px;display:grid;place-items:center;font-size:38px;font-weight:700;color:#fff;background:linear-gradient(135deg,#8e8e93,#636366);box-shadow:var(--shadow)}
.skills{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.skills span{font-size:13px;padding:5px 12px;border-radius:999px;background:var(--fill);font-weight:500}

/* bottom tab bar */
#tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + var(--safe-b));z-index:50;display:flex;gap:2px;padding:6px;border-radius:999px;max-width:calc(100vw - 24px)}
#tabbar a,#tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 9px;border-radius:999px;color:var(--muted);font-size:10.5px;font-weight:600;cursor:pointer;min-width:52px;position:relative;white-space:nowrap;transition:.2s}
#tabbar svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#tabbar .on{color:var(--acc);background:var(--fill)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:140;background:rgba(0,0,0,.4);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.sheet .body{width:100%;max-width:560px;max-height:88vh;overflow-y:auto;background:var(--solid);border-radius:28px 28px 0 0;padding:10px 22px calc(26px + var(--safe-b));animation:up .35s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 16px}
@media(min-width:700px){.sheet{align-items:center}.sheet .body{border-radius:28px}}

/* auth gate */
#gate{position:fixed;inset:0;z-index:200;background:var(--bg);display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:20px;overflow-y:auto}
#gate.hidden{display:none}
.auth{width:100%;max-width:390px;min-width:0;padding:6px 0;margin:0 auto}
.auth .logo{width:84px;height:84px;border-radius:22px;display:block;margin:0 auto 14px;box-shadow:0 12px 30px rgba(52,199,89,.4)}
.auth h1{text-align:center;font-size:32px;font-weight:800;letter-spacing:-.035em}
.auth .tag{text-align:center;color:var(--muted);margin:6px 0 22px;font-size:15px}
.gbtn{background:var(--solid);box-shadow:var(--shadow);margin-bottom:16px}
#err{text-align:center;color:var(--bad);font-size:14px;min-height:20px;margin-top:10px}
.sw{text-align:center;font-size:15px;color:var(--muted);margin-top:10px}.sw a{color:var(--blue);font-weight:600;cursor:pointer}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin:4px 0 14px}.or::before,.or::after{content:"";flex:1;height:.5px;background:var(--line)}
.demo-link{display:block;text-align:center;margin-top:18px;color:var(--blue);font-weight:600;font-size:15px;cursor:pointer}

#toast{position:fixed;left:50%;top:calc(var(--safe-t) + 14px);transform:translateX(-50%) translateY(-90px);padding:12px 20px;border-radius:999px;background:var(--solid);box-shadow:var(--shadow);font-size:14px;font-weight:600;z-index:300;transition:.45s cubic-bezier(.2,.9,.3,1);max-width:90vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.16,1,.3,1),transform .6s cubic-bezier(.16,1,.3,1)}
.reveal.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}.blob{animation:none}}
.dot{position:absolute;top:1px;right:9px;min-width:16px;height:16px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
#chat{position:fixed;left:0;right:0;top:0;height:100dvh;z-index:130;background:var(--bg);display:flex;flex-direction:column}
.ch-top{display:flex;align-items:center;gap:12px;padding:calc(var(--safe-t) + 10px) 14px 10px;border-bottom:.5px solid var(--line);background:var(--solid)}
.ch-top button{font-size:34px;line-height:1;color:var(--blue);padding:0 8px 4px}
.ch-top .m{font-size:13px;color:var(--muted)}
#ch-list{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:6px}
.msg{max-width:78%;width:fit-content;padding:9px 13px;border-radius:18px;font-size:15.5px;white-space:pre-wrap;word-break:break-word}
.msg.me{margin-left:auto;background:var(--acc);color:var(--acc-t);border-bottom-right-radius:6px}
.msg.them{background:var(--fill);border-bottom-left-radius:6px}
.ch-in{display:flex;gap:8px;align-items:flex-end;padding:10px 12px calc(10px + var(--safe-b));background:var(--solid);border-top:.5px solid var(--line)}
.ch-in textarea{flex:1;background:var(--fill);border:0;outline:0;border-radius:18px;padding:10px 14px;color:var(--text);font:inherit;font-size:16px;resize:none;max-height:120px}
.ch-in button{height:40px;padding:0 18px;border-radius:999px;background:var(--acc);color:var(--acc-t);font-weight:700}
.ch-in button:disabled{opacity:.5}
.legal{text-align:center;font-size:13px;color:var(--muted);margin:18px 0 6px}.legal a{color:var(--blue);font-weight:600}
.hide{display:none!important}

/* ===== clean, professional refresh ===== */
:root{--bg:#f5f6f8;--card:#fff;--solid:#fff;--line:rgba(15,23,42,.09);--fill:rgba(15,23,42,.055);--acc:#16a34a;--acc-t:#fff;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 4px 14px rgba(15,23,42,.05);--bar:rgba(255,255,255,.85);--r:16px;--side:240px}
@media(prefers-color-scheme:dark){:root{--bg:#0b0c0e;--card:#15171a;--solid:#15171a;--line:rgba(255,255,255,.09);--fill:rgba(255,255,255,.07);
  --acc:#30d158;--acc-t:#04140a;--shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);--bar:rgba(21,23,26,.85)}}
.blobs{display:none}
.glass{background:var(--card);-webkit-backdrop-filter:none;backdrop-filter:none;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:var(--r)}
#top{background:var(--bar);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);border-bottom:1px solid var(--line);padding-bottom:10px}
#tabbar{background:var(--bar);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);border:1px solid var(--line);box-shadow:0 8px 24px rgba(15,23,42,.14)}
#tabbar .on{background:rgba(22,163,74,.12)}
.chip{background:var(--fill)}
.large{font-size:clamp(28px,6vw,34px);letter-spacing:-.03em}
.sub{margin-bottom:18px}
.search{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);height:46px;border-radius:12px}
.chips button{background:var(--card);border:1px solid var(--line);font-size:13.5px;padding:7px 14px}
.chips button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.card{padding:20px;border-radius:var(--r);gap:8px}
.card h3{font-size:18px}
.cat{font-size:11.5px}
.foot{border-top:1px solid var(--line)}
.item{border-radius:14px}
.group{border-radius:var(--r);border:1px solid var(--line);box-shadow:none}
.group .r,.group .col{border-bottom:1px solid var(--line)}
.banner{border-radius:12px}
.btn{height:48px;border-radius:12px;font-size:16px}
.btn-p{box-shadow:none}
.btn-s{background:var(--card);border:1px solid var(--line)}
.btn-d{border:1px solid var(--line)}
.btn-sm{height:34px;border-radius:10px;font-size:13.5px;padding:0 14px}
.sheet .body{border-radius:20px 20px 0 0}
@media(min-width:700px){.sheet .body{border-radius:20px}}
.group-title{margin:0 2px 10px}
.ghead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ghead .btn{margin-bottom:6px}
em{font-style:normal;color:var(--muted);margin-left:6px;text-transform:none;letter-spacing:0}
@media(hover:hover){.card:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(15,23,42,.12)}.btn-p:hover{filter:brightness(.93)}.chips button:hover,.item:hover{border-color:var(--muted)}#tabbar a:hover{background:var(--fill)}}

/* ===== desktop: sidebar layout ===== */
@media(min-width:900px){
  #top .bar-in{max-width:none;padding:0 12px}
  #top{padding:12px 20px}
  #tabbar{left:0;top:60px;bottom:0;transform:none;width:var(--side);max-width:none;border-radius:0;border:0;border-right:1px solid var(--line);box-shadow:none;
    flex-direction:column;justify-content:flex-start;gap:4px;padding:18px 14px;background:var(--card);-webkit-backdrop-filter:none;backdrop-filter:none}
  #tabbar a,#tabbar button{flex-direction:row;justify-content:flex-start;gap:12px;font-size:15px;padding:11px 14px;border-radius:12px;width:100%;min-width:0}
  #tabbar svg{width:20px;height:20px}
  .dot{top:50%;right:14px;margin-top:-8px}
  main{max-width:none;margin:0 0 0 var(--side);padding:88px clamp(24px,4vw,56px) 60px}
  #app>*{max-width:1080px;margin-left:auto;margin-right:auto}
  .chips{margin-left:auto;margin-right:auto;padding-left:0;padding-right:0}
  #app[data-v=post]>*,#app[data-v=profile]>*{max-width:640px}
  #app[data-v=inbox]>*,#app[data-v=admin]>*,#app[data-v=mine]>*{max-width:820px}
  #chat{left:50%;right:auto;transform:translateX(-50%);width:min(760px,100vw);border-left:1px solid var(--line);border-right:1px solid var(--line);box-shadow:0 0 80px rgba(0,0,0,.25)}
  #toast{left:calc(50% + var(--side)/2)}
}

/* ===== voice notes ===== */
.ch-in #ch-mic,.ch-in #rc-x{width:40px;height:40px;padding:0;background:var(--fill);color:var(--text);font-size:18px}
.ch-rec{flex:1;display:flex;align-items:center;gap:10px;padding:0 6px;font-size:16px}
.rdot{width:10px;height:10px;border-radius:50%;background:var(--bad);animation:blink 1s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.msg.vn{display:flex;align-items:center;gap:10px;min-width:210px}
.vn-play{width:34px;height:34px;border-radius:50%;flex:none;background:rgba(127,127,127,.28);font-size:13px;display:grid;place-items:center}
.vn-bar{flex:1;height:4px;border-radius:2px;background:rgba(127,127,127,.35);overflow:hidden}
.vn-bar i{display:block;height:100%;width:0;background:currentColor}
.vn-t{font-size:12px;font-variant-numeric:tabular-nums;opacity:.85}

/* ===== liquid glass touches (bars and sheets only) ===== */
#tabbar{-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);
  box-shadow:0 12px 32px rgba(15,23,42,.16),inset 0 1px 0 rgba(255,255,255,.65),inset 0 -1px 0 rgba(255,255,255,.2)}
@media(prefers-color-scheme:dark){#tabbar{box-shadow:0 12px 32px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.12)}}
#tabbar a,#tabbar button{transition:background .3s cubic-bezier(.2,.9,.3,1),color .2s,transform .25s cubic-bezier(.2,.9,.3,1)}
#tabbar a:active{transform:scale(.9)}
#tabbar .on{box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.sheet .body{animation:up .5s cubic-bezier(.2,1.05,.3,1)}
.sheet{-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#toast{background:var(--bar);-webkit-backdrop-filter:blur(20px) saturate(170%);backdrop-filter:blur(20px) saturate(170%);border:1px solid var(--line)}
.ch-top,.ch-in{background:var(--bar);-webkit-backdrop-filter:blur(20px) saturate(170%);backdrop-filter:blur(20px) saturate(170%)}
.btn:active,.chips button:active{transform:scale(.96)}
@media(min-width:900px){#tabbar{box-shadow:none}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ===== liquid gloss: gradients and shadows only, no blur on lists, so it stays smooth on phones ===== */
:root{--gl1:rgba(255,255,255,.95);--gl2:rgba(255,255,255,0);--rim:rgba(255,255,255,.9);--sh:0 12px 28px -16px rgba(15,23,42,.38)}
@media(prefers-color-scheme:dark){:root{--gl1:rgba(255,255,255,.09);--gl2:rgba(255,255,255,0);--rim:rgba(255,255,255,.13);--sh:0 14px 30px -16px rgba(0,0,0,.9)}}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(700px 420px at 6% -4%,color-mix(in srgb,var(--acc) 20%,transparent),transparent 65%),radial-gradient(640px 420px at 104% 8%,rgba(10,132,255,.14),transparent 65%),radial-gradient(520px 380px at 50% 112%,color-mix(in srgb,var(--acc) 12%,transparent),transparent 65%)}
.glass,.group,.item,.card{background:linear-gradient(180deg,var(--gl1),var(--gl2) 46%),var(--card);box-shadow:var(--sh),inset 0 1px 0 var(--rim);border-radius:20px}
.card{content-visibility:auto;contain-intrinsic-size:auto 170px}
.card,.item,.btn,.chips button{transition:transform .4s cubic-bezier(.34,1.56,.64,1),box-shadow .3s ease,background .3s ease}
.card:active,.item:active{transform:scale(.975)}
@media(hover:hover){.card:hover{transform:translateY(-3px);box-shadow:0 18px 34px -16px rgba(0,0,0,.45),inset 0 1px 0 var(--rim)}}
.btn-p{background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,0) 55%),var(--acc);box-shadow:0 12px 24px -10px color-mix(in srgb,var(--acc) 80%,transparent),inset 0 1px 0 rgba(255,255,255,.55),inset 0 -2px 0 rgba(0,0,0,.1)}
.btn-s{background:linear-gradient(180deg,var(--gl1),var(--gl2) 60%),var(--fill);box-shadow:inset 0 1px 0 var(--rim)}
.chips button{background:linear-gradient(180deg,var(--gl1),var(--gl2) 70%),var(--fill);box-shadow:inset 0 1px 0 var(--rim)}
.chips button.on{background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 60%),var(--text)}
.sheet .body{background:linear-gradient(180deg,var(--gl1),var(--gl2) 28%),var(--solid);border-radius:32px 32px 0 0;box-shadow:inset 0 1px 0 var(--rim)}
.msg{box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}
.locsel,input,textarea,select{transition:box-shadow .25s ease,border-color .25s ease}
input:focus,textarea:focus,select:focus{outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 30%,transparent)}
#ng{position:fixed;inset:0;z-index:300;display:grid;place-items:center;padding:24px;background:var(--bg)}
#ng .box{max-width:420px;width:100%;text-align:center;padding:28px 22px}
#ng .bell{width:84px;height:84px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;font-size:40px;background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,0) 55%),var(--acc);box-shadow:0 14px 30px -10px color-mix(in srgb,var(--acc) 80%,transparent),inset 0 1px 0 rgba(255,255,255,.6)}
#ng h2{font-size:26px;font-weight:800;letter-spacing:-.03em;margin:0 0 8px}#ng p{color:var(--muted);font-size:15.5px;line-height:1.5;margin:0 0 20px}

/* ===== welcome pop-up ===== */
#wp{position:fixed;inset:0;z-index:290;display:grid;place-items:center;padding:24px;background:rgba(10,12,16,.5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);animation:wpf .2s ease}
#wp.out{opacity:0;transition:opacity .18s}
#wp .box{position:relative;max-width:400px;width:100%;text-align:center;padding:32px 22px 22px;animation:wpp .38s cubic-bezier(.2,1.1,.3,1)}
#wp .wp-ic{width:76px;height:76px;margin:0 auto 16px;border-radius:50%;display:grid;place-items:center;font-size:34px;background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,0) 55%),var(--acc);box-shadow:0 14px 30px -10px color-mix(in srgb,var(--acc) 80%,transparent),inset 0 1px 0 rgba(255,255,255,.6)}
#wp h2{font-size:26px;font-weight:800;letter-spacing:-.03em;margin:0 0 8px}
#wp p{color:var(--muted);font-size:15.5px;line-height:1.5;margin:0 0 20px}
#wp .box:focus{outline:none}
#wp .wp-x{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;background:var(--fill);color:var(--muted);font-size:14px;display:grid;place-items:center}
@keyframes wpf{from{opacity:0}}
@keyframes wpp{from{opacity:0;transform:scale(.92) translateY(10px)}}

/* ===== quiet "Get verified" row ===== */
.vrow{display:flex;align-items:center;gap:10px;font-size:13.5px;line-height:1.35;color:var(--muted);padding:9px 10px 9px 12px;border-radius:12px;background:var(--fill);margin-bottom:12px}
.vrow>span:nth-child(2){flex:1}
.vrow .btn{flex:none;height:30px;padding:0 12px;font-size:13px}

/* ===== Liquid Glass chat theme (verified only) ===== */
.ct-row{display:flex;gap:10px;margin:6px 0 16px}
.ct-o{flex:1;border:2px solid var(--line);border-radius:16px;padding:8px;background:var(--fill);display:grid;gap:6px;justify-items:center;font-size:13px;font-weight:600;transition:border-color .2s}
.ct-o.on{border-color:var(--acc)}
.ct-pv{display:block;width:100%;height:56px;border-radius:10px;background:var(--solid);position:relative;overflow:hidden}
.ct-pv.g{background:radial-gradient(70% 90% at 15% 20%,#ff9f0a,transparent 60%),radial-gradient(70% 90% at 90% 80%,#0a84ff,transparent 60%),#2a1b4d}
.ct-pv.g b{position:absolute;left:10px;right:26px;top:17px;height:22px;border-radius:13px;border:1px solid rgba(255,255,255,.5);background:linear-gradient(135deg,rgba(255,255,255,.28),rgba(255,255,255,.04));box-shadow:inset 0 1px 1px rgba(255,255,255,.7)}

#chat.lg{color:#fff;background:radial-gradient(70% 45% at 12% 8%,color-mix(in srgb,var(--acc) 85%,transparent),transparent 70%),radial-gradient(65% 45% at 95% 40%,rgba(10,132,255,.75),transparent 70%),radial-gradient(70% 50% at 20% 100%,rgba(191,90,242,.65),transparent 70%),#0b0e17}
#chat.lg .ch-top,#chat.lg .ch-in{position:absolute;left:10px;right:10px;z-index:3;
  background:linear-gradient(135deg,rgba(255,255,255,.1),rgba(255,255,255,0) 45%,rgba(255,255,255,.04));
  -webkit-backdrop-filter:blur(5px) saturate(170%);backdrop-filter:blur(5px) saturate(170%);
  border:1px solid rgba(255,255,255,.28);border-radius:32px;
  box-shadow:inset 0 1px 1px rgba(255,255,255,.65),inset 0 -1px 1px rgba(255,255,255,.18),inset 0 0 18px rgba(255,255,255,.04),0 10px 30px rgba(0,0,0,.14)}
#chat.lg .ch-top{top:calc(var(--safe-t) + 8px);padding:8px 12px 8px 8px;gap:10px}
#chat.lg .ch-in{bottom:calc(var(--safe-b) + 8px);padding:8px;border-top:1px solid rgba(255,255,255,.28)}
#chat.lg .ch-top .m{display:none}
#chat.lg .ch-top b{color:#fff;font-size:17px;text-shadow:0 1px 3px rgba(0,0,0,.45)}
#chat.lg .ch-top button{width:38px;height:38px;padding:0 0 3px;border-radius:50%;display:grid;place-items:center;font-size:28px;color:#fff;flex:none;
  background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.3);box-shadow:inset 0 1px 1px rgba(255,255,255,.55)}
#chat.lg .ch-top #ch-bg{font-size:18px!important;padding:0}
#chat.lg #ch-list{background:transparent!important;padding:96px 14px 100px;gap:8px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#chat.lg #ch-list::-webkit-scrollbar{display:none}
#chat.lg .msg{position:relative;isolation:isolate;color:#fff!important;text-shadow:0 1px 2px rgba(0,0,0,.6),0 0 8px rgba(0,0,0,.25);
  background:linear-gradient(135deg,rgba(255,255,255,.06),rgba(255,255,255,0) 50%,rgba(255,255,255,.03))!important;
  -webkit-backdrop-filter:blur(2px) saturate(160%);backdrop-filter:blur(2px) saturate(160%);
  border:1px solid rgba(255,255,255,.3);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.6),inset 0 -1px 2px rgba(255,255,255,.14),inset 0 0 14px rgba(255,255,255,.04),0 6px 18px rgba(0,0,0,.1)}
#chat.lg .msg::before{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;pointer-events:none;background:radial-gradient(120% 70% at 12% 0%,rgba(255,255,255,.22),transparent 42%)}
#chat.lg .msg.me{background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 20%,transparent),rgba(255,255,255,0) 60%,color-mix(in srgb,var(--acc) 8%,transparent))!important}
#chat.lg .msg.pop{animation:lgPop .5s cubic-bezier(.2,1.2,.3,1) both}
@keyframes lgPop{from{opacity:0;transform:translateY(14px) scale(.9)}to{opacity:1;transform:none}}
#chat.lg .ch-in textarea{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:22px;box-shadow:inset 0 1px 2px rgba(0,0,0,.15)}
#chat.lg .ch-in textarea::placeholder{color:rgba(255,255,255,.65)}
#chat.lg .ch-in button{background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.34);box-shadow:inset 0 1px 1px rgba(255,255,255,.6);text-shadow:0 1px 2px rgba(0,0,0,.35)}
#chat.lg .vn-play{background:rgba(255,255,255,.22)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){#chat.lg .msg,#chat.lg .ch-top,#chat.lg .ch-in{background:rgba(255,255,255,.16)!important}}

/* ===== bell + compact sent pill ===== */
.tright{display:flex;align-items:center;gap:8px}
#bell{position:relative;width:36px;height:36px;border-radius:50%;background:var(--fill);display:grid;place-items:center;border:0;color:inherit;cursor:pointer}
#bell svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#bell .dot{top:-3px;right:-3px;margin:0}
#bell.ring svg{animation:bellRing .8s ease 1}
@keyframes bellRing{0%,100%{transform:rotate(0)}20%{transform:rotate(16deg)}40%{transform:rotate(-14deg)}60%{transform:rotate(8deg)}80%{transform:rotate(-5deg)}}
.nf{display:flex;gap:10px;align-items:flex-start;padding:12px 4px;border-bottom:1px solid var(--line);cursor:default}
.nf.go{cursor:pointer}.nf:last-child{border-bottom:0}
.nf i{flex:none;width:9px;height:9px;border-radius:50%;margin-top:6px;background:transparent}
.nf.new i{background:var(--acc);box-shadow:0 0 8px var(--acc)}
.nf b{display:block;font-size:15px}.nf span{display:block;font-size:14px;color:var(--muted);margin-top:2px}.nf small{color:var(--muted);font-size:12px}
.sent-pill{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;padding:5px 11px;border-radius:999px;background:var(--fill);border:0;color:inherit;cursor:pointer;margin:0 0 14px}
.sent-pill .glow{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 6px var(--acc),0 0 12px var(--acc);animation:sentGlow 2s ease-in-out infinite}
@keyframes sentGlow{50%{opacity:.4;box-shadow:0 0 3px var(--acc)}}
.sent-l{margin:-6px 0 16px;display:flex;flex-direction:column;gap:6px}
.sent-l div{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;padding:6px 10px;border-radius:12px;background:var(--fill)}
/* ===== find people ===== */
.ppl-res{display:flex;flex-direction:column;gap:8px;margin:0 0 22px}
.ppl-res .item{align-items:center}
.ppl-res .btn-sm{flex:none}
</style>
</head>

// Shows the first n children of a list and a "See more" button for the rest.
function seeMore(listEl,n,label){
  const kids=[...listEl.children]; if(kids.length<=n) return;
  kids.slice(n).forEach(k=>k.classList.add("hide"));
  const b=document.createElement("button"); b.className="btn btn-s btn-sm"; b.style.cssText="margin:10px auto 0;display:block";
  b.textContent="See more ("+(kids.length-n)+")";
  b.onclick=()=>{ kids.forEach(k=>k.classList.remove("hide")); b.remove(); };
  listEl.after(b);
}

  let closed=false;
  const close=go=>{
    if(closed) return; closed=true; document.removeEventListener("keydown",esc);
    w.classList.add("out");
    setTimeout(()=>{ w.remove(); if(go) location.hash="#post"; if(done) done(); },180);
  };

function notifGate(){
  if(DEMO||!("Notification" in window)||Notification.permission==="granted") return;
  const ios=/iPhone|iPad|iPod/i.test(navigator.userAgent), standalone=navigator.standalone||matchMedia("(display-mode: standalone)").matches;
  if(!("serviceWorker" in navigator)||(!("PushManager" in window)&&!ios)) return;
  let g=$("ng"); if(g) return; g=document.createElement("div"); g.id="ng"; document.body.appendChild(g);
  const close=()=>g.remove(), skip=`<button class="btn btn-s" id="ng-skip" style="margin-top:10px">Continue without alerts</button>`;
  const draw=()=>{
    let t,body,btn;
    if(ios&&!standalone){ t="Add Lagos Gig to your Home Screen"; body="To get message alerts on iPhone: tap the Share button, choose Add to Home Screen, then open Lagos Gig from your home screen."; btn=skip.replace("Continue without alerts","Continue"); }
    else if(Notification.permission==="denied"){ t="Notifications are blocked"; body="You will miss messages from clients. Tap the lock icon next to the address bar, set Notifications to Allow, then tap Check again."; btn=`<button class="btn btn-p" id="ng-chk">Check again</button>`+skip; }
    else { t="Turn on notifications"; body="You need them to know the moment someone messages you. Without them you can miss clients and jobs."; btn=`<button class="btn btn-p" id="ng-on">Turn on notifications</button>`; }
    g.innerHTML=`<div class="glass box"><div class="bell">🔔</div><h2>${t}</h2><p>${body}</p>${btn}</div>`;
    if($("ng-skip")) $("ng-skip").onclick=close;
    if($("ng-chk")) $("ng-chk").onclick=()=>{ if(Notification.permission==="granted"){ syncPush().catch(()=>{}); close(); } else { toast("Still blocked"); draw(); } };
    if($("ng-on")) $("ng-on").onclick=async()=>{
      const r=await Notification.requestPermission();
      if(r==="granted"){ try{ await syncPush(); toast("Notifications are on"); }catch(e){ toast(e.message||"Could not finish turning on notifications"); } close(); }
      else draw();
    };
  };
  draw();
}

function squareJpeg(file,size){
  return new Promise((res,rej)=>{
    const img=new Image(), u=URL.createObjectURL(file);
    img.onload=()=>{
      const s=Math.min(img.width,img.height), c=document.createElement("canvas"); c.width=c.height=size;
      c.getContext("2d").drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,size,size);
      URL.revokeObjectURL(u);
      c.toBlob(b=>b?res(b):rej(new Error("Could not process image")),"image/jpeg",.85);
    };
    img.onerror=()=>{ URL.revokeObjectURL(u); rej(new Error("Could not read that image")); };
    img.src=u;
  });
}

async function syncPush(){

let chatCh=null, chatPoll=null, chatStop=null, curAudio=null;
const fmtDur=ms=>{ const t=Math.max(0,Math.round((ms||0)/1000)); return Math.floor(t/60)+":"+String(t%60).padStart(2,"0"); };
function stopVoice(){ if(curAudio){ try{ curAudio.a.pause(); }catch(_){} curAudio.reset(); curAudio=null; } }
function wireVoice(d,m){
  const btn=d.querySelector(".vn-play"), fill=d.querySelector(".vn-bar i"), tm=d.querySelector(".vn-t");
  let a=null;
  const reset=()=>{ btn.textContent="▶"; fill.style.width="0"; tm.textContent=fmtDur(m.audio_ms); };
  btn.onclick=async()=>{
    if(a&&!a.paused){ a.pause(); btn.textContent="▶"; return; }
    if(curAudio&&curAudio.a!==a) stopVoice();
    if(!a){
      btn.disabled=true;
      const r=await sb.storage.from("voice").createSignedUrl(m.audio_path,3600);
      btn.disabled=false;
      if(r.error||!r.data){ toast("Could not load voice note"); return; }
      a=new Audio(r.data.signedUrl);
      a.ontimeupdate=()=>{ if(a.duration) fill.style.width=(a.currentTime/a.duration*100)+"%"; tm.textContent=fmtDur(a.currentTime*1000); };
      a.onended=()=>{ reset(); curAudio=null; };
    }
    curAudio={a,reset}; btn.textContent="❚❚";
    try{ await a.play(); }catch(_){ btn.textContent="▶"; toast("Tap again to play"); }
  };
}
async function openChat(cid){

  const {data:lk}=await sb.from("profiles").select("id,bubble_color,chat_bg,chat_bg_at,verified,is_admin").in("id",[me.id,other]); const bc={}; (lk||[]).forEach(x=>{ if(okHex(x.bubble_color)) bc[x.id]=x.bubble_color; });
  const el=$("chat");
  el.innerHTML=`<div class="ch-top"><button id="ch-back" aria-label="Back">‹</button><div class="plink" id="ch-who" data-uid="${esc(other)}">${avS(p,38)}<div style="min-width:0"><b>${esc(p?.full_name||"Member")}</b> ${p?.verified?'<span class="tick">✓</span>':""}<div class="m">${esc(c.gig_title||"Direct message")}</div></div></div><button id="ch-bg" aria-label="Chat background" style="font-size:22px">🖼</button></div>
  <div id="ch-list"></div>

    if(glass){ list.style.background=""; el.style.background=u?'linear-gradient(rgba(0,0,0,.14),rgba(0,0,0,.14)), url("'+u+'") center/cover no-repeat':""; }

    const fit=()=>{ list.style.paddingTop=(gt.offsetTop+gt.offsetHeight+14)+"px"; list.style.paddingBottom=(gb.offsetHeight+(parseFloat(getComputedStyle(gb).bottom)||0)+14)+"px"; };

  }
  /* one background per person, shared across all their chats. Only verified people count; if both set one, the most recently changed wins. */
  const pickBg=rows=>{ let best=null; (rows||[]).forEach(x=>{ if(!x.chat_bg||!(x.verified||x.is_admin)) return; if(!best||new Date(x.chat_bg_at||0)>new Date(best.chat_bg_at||0)) best=x; }); return best?best.chat_bg:null; };
  let curBg=pickBg(lk);
  const syncBg=async()=>{ const {data}=await sb.from("profiles").select("id,chat_bg,chat_bg_at,verified,is_admin").in("id",[me.id,other]); if(!data) return; const nb=pickBg(data); if(nb!==curBg){ curBg=nb; setBg(nb); } };
  setBg(curBg);
  const paint=(d,m)=>{
    d.textContent=""; const t=document.createElement("span"); t.textContent=m.body; d.appendChild(t);
    if(m.edited_at){ const e=document.createElement("small"); e.textContent=" (edited)"; e.style.opacity=".65"; d.appendChild(e); }
    if(m.sender===me.id&&hasPass()){ const b=document.createElement("button"); b.className="ed-btn"; b.textContent="✎"; b.setAttribute("aria-label","Edit message"); b.onclick=()=>startEdit(m); d.appendChild(b); }
  };
  const add=m=>{
    if(!m) return; markRead(cid,m.created_at); if(seen.has(m.id)){ if(els[m.id]&&(m.body!==msgs[m.id].body||m.edited_at!==msgs[m.id].edited_at)){ msgs[m.id]=m; paint(els[m.id],m); } return; } seen.add(m.id);
    const d=document.createElement("div"); d.className="msg "+(m.sender===me.id?"me":"them"); { const col=bc[m.sender]; if(col){ d.style.background=col; d.style.color=onCol(col); } }
    if(m.audio_path){ d.classList.add("vn"); d.innerHTML=`<button class="vn-play" aria-label="Play voice note">▶</button><div class="vn-bar"><i></i></div><span class="vn-t"></span>`; d.querySelector(".vn-t").textContent=fmtDur(m.audio_ms); wireVoice(d,m); }
    else { els[m.id]=d; msgs[m.id]=m; paint(d,m); }
    if(ready) d.classList.add("pop"); list.appendChild(d); scrollEnd();
  };
  const load=async()=>{ const r=await sb.from("messages").select("*").eq("conversation_id",cid).order("created_at").limit(500); if(!r.error&&r.data) r.data.forEach(add); };
  await load(); ready=true;
  chatCh=sb.channel("chat-"+cid).on("postgres_changes",{event:"INSERT",schema:"public",table:"messages",filter:"conversation_id=eq."+cid},pl=>add(pl.new)).on("postgres_changes",{event:"UPDATE",schema:"public",table:"messages",filter:"conversation_id=eq."+cid},pl=>add(pl.new)).subscribe();
  chatPoll=setInterval(()=>{ if(!document.hidden){ load(); syncBg(); } },20000);
  const bar=$("ch-bar");
  const normal=`<button id="ch-mic" aria-label="Record voice note">🎤</button><textarea id="ch-text" rows="1" maxlength="2000" placeholder="Message"></textarea><button id="ch-send">Send</button>`;
  const send=async()=>{
    const t=$("ch-text"), body=t.value.trim(); if(!body) return;
    if(!canUse()) return;
    $("ch-send").disabled=true;
    const {data,error}=await sb.from("messages").insert({conversation_id:cid,sender:me.id,body}).select().single();

  };
  async function startRec(){
    if(!canUse()) return;
    if(!navigator.mediaDevices||!window.MediaRecorder){ toast("Voice notes are not supported on this browser"); return; }
    let stream; try{ stream=await navigator.mediaDevices.getUserMedia({audio:true}); }catch(_){ toast("Allow microphone access to send voice notes"); return; }
    const mime=pickMime(), mr=new MediaRecorder(stream,mime?{mimeType:mime}:undefined), chunks=[], t0=Date.now();
    mr.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };

    mr.start();
    bar.innerHTML=`<button id="rc-x" aria-label="Cancel">✕</button><div class="ch-rec"><span class="rdot"></span><b id="rc-t">0:00</b></div><button id="rc-go">Send</button>`;
    tmr=setInterval(()=>{ const sec=Math.floor((Date.now()-t0)/1000); const el=$("rc-t"); if(el) el.textContent=fmtDur(sec*1000); if(sec>=120) finishRec(true); },250);
    $("rc-x").onclick=()=>finishRec(false); $("rc-go").onclick=()=>finishRec(true);
  }
  function finishRec(doSend){
    if(!rec) return; const r=rec; rec=null; clearInterval(tmr);
    r.mr.onstop=async()=>{
      r.stream.getTracks().forEach(t=>t.stop()); bindBar();
      if(!doSend) return;
      const ms=Date.now()-r.t0; if(ms<800){ toast("Too short. Hold a little longer."); return; }
      const type=(r.mime||"audio/webm").split(";")[0], blob=new Blob(r.chunks,{type});

    }
    $("pq-n").textContent=gigs.length?"· "+gigs.length:"";
    $("pq").innerHTML=gigs.length?gigs.map(x=>`<div class="glass item"><div class="grow"><b>${esc(x.title)}</b><div class="m">${esc(x.profiles?.full_name)} · ${esc(x.category)} · ${naira(x.budget)}${x.created_at?" · "+new Date(x.created_at).toLocaleDateString("en-NG",{day:"numeric",month:"short"}):""}</div><p style="font-size:14px;margin-top:6px">${esc((x.description||"").slice(0,300))}</p></div>
    <div class="actions"><button class="btn btn-p btn-sm" data-ok="${esc(x.id)}">Approve</button><button class="btn btn-s btn-sm" style="color:var(--bad)" data-no="${esc(x.id)}">Reject</button></div></div>`).join(""):`<div class="empty">Nothing waiting 🎉</div>`;
    document.querySelectorAll("[data-ok]").forEach(b=>b.onclick=async()=>{if(!live())return;const r=await sb.from("gigs").update({status:"approved"}).eq("id",b.dataset.ok);if(r.error)toast(r.error.message);loadGigs();});
    document.querySelectorAll("[data-no]").forEach(b=>b.onclick=async()=>{if(!live())return;const r=await sb.from("gigs").update({status:"rejected"}).eq("id",b.dataset.no);if(r.error)toast(r.error.message);loadGigs();});
  }
  async function loadUsers(){
    const my=++seq, q=$("a-q").value.trim().replace(/[,()%*\\"]/g," ").trim();
    let users=[];
    if(DEMO){ users=DEMO_USERS.filter(u=>!q||(u.full_name+" "+u.username).toLowerCase().includes(q.toLowerCase())); }
    else{
      let qb=sb.from("profiles").select("*").order("created_at",{ascending:false}).limit(50);
      if(q) qb=qb.or(`full_name.ilike.%${q}%,username.ilike.%${q}%`);
      const r=await qb; if(my!==seq) return;
      if(r.error){ $("ul").innerHTML=`<div class="empty">${esc(r.error.message)}</div>`; return; }
      users=r.data||[];
    }
    $("ul-n").textContent=users.length?"· "+users.length+(users.length===50?"+":""):"";
    $("ul").innerHTML=users.length?users.map(x=>`<div class="glass item"><div class="grow"><b>${esc(x.full_name||"No name")}</b> ${x.verified?'<span class="tick">✓</span>':""}<div class="m">${x.username?"@"+esc(x.username)+" · ":""}${esc(x.location||"")} ${x.is_admin?"· admin":""}</div></div>
    <button class="btn btn-s btn-sm" data-v="${esc(x.id)}" data-val="${x.verified}">${x.verified?"Remove tick":"Give blue tick"}</button></div>`).join(""):`<div class="empty">${q?"No members match “"+esc(q)+"”":"No members yet"}</div>`;
    document.querySelectorAll("[data-v]").forEach(b=>b.onclick=async()=>{if(!live())return;const r=await sb.from("profiles").update({verified:b.dataset.val!=="true"}).eq("id",b.dataset.v);if(r.error)toast(r.error.message);loadUsers();});
  }
  $("a-ref").onclick=async()=>{
    const b=$("a-ref"); b.disabled=true; b.textContent="Refreshing...";
    await Promise.all([loadGigs(),loadUsers()]);
    b.disabled=false; b.textContent="↻ Refresh"; toast("Up to date");
  };
  let t; $("a-q").oninput=()=>{ clearTimeout(t); t=setTimeout(loadUsers,300); };
  await Promise.all([loadGigs(),loadUsers()]);
}
setMode("signup");
if(DEMO){
  $("demo-go").classList.remove("hide"); $("demo-go").onclick=boot;
  boot(); // open straight into the preview so the page is never blank
}else{
  // IMPORTANT: never await other Supabase calls inside this callback (it deadlocks). Defer the work instead.
  sb.auth.onAuthStateChange((_e, session)=>{
    setTimeout(async()=>{
      if(session && (!me || me.id!==session.user.id || !profile)){ me=session.user; await boot(); }
      if(!session){ me=null; profile=null; booting=false; $("gate").classList.remove("hidden"); ["top","app","tabbar"].forEach(i=>$(i).classList.add("hide")); }
    },0);
  });
  (async()=>{const {data}=await sb.auth.getSession(); if(data.session && !profile){me=data.session.user; await boot();}})();
}
</script>
</body>
</html>
